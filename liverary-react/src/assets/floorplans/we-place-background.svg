    <g data-seat-group="armchair-2"><use href="#armchair-pair" x="1040" y="440" transform="rotate(90 1040 440)"/></g>
    <g data-seat-group="armchair-3"><use href="#armchair-pair" x="1040" y="660" transform="rotate(90 1040 660)"/></g>
  </g>
  <text x="308" y="992">로비 · 통로</text>
  <path d="M215 1027H303M215 1027L228 1016M215 1027L228 1038" fill="none" stroke="#bac1cd" stroke-width="3" stroke-linecap="round"/>
</svg>
