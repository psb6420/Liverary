    <g data-seat-group="small-table-2"><use href="#common-table" x="710" y="490"/><text x="710" y="499" style="font-size:21px">테이블 2</text></g>
    <g data-seat-group="small-table-3"><use href="#common-table" x="405" y="750"/><text x="405" y="759" style="font-size:21px">테이블 3</text></g>
    <g data-seat-group="small-table-4"><use href="#common-table" x="710" y="750"/><text x="710" y="759" style="font-size:21px">테이블 4</text></g>
  </g>
  <g id="exterior-window" fill="none" stroke="#bac9d9" stroke-width="4">
    <path d="M1160 90V740Q1190 1340 870 1450H40"/>
    <path d="M1148 90V740Q1178 1328 870 1438H40" stroke="#d0dde8"/>
    <path d="M1148 180H1160M1148 290H1160M1148 400H1160M1148 510H1160M1148 620H1160M1148 730H1160M1150 842L1162 844M1144 955L1156 958M1121 1063L1133 1067M1094 1174L1106 1178M1044 1270L1055 1277M977 1355L986 1364M902 1416L909 1426M800 1438V1450M690 1438V1450M580 1438V1450M470 1438V1450M360 1438V1450M250 1438V1450M140 1438V1450"/>
  </g>
  <g id="window-bar">
    <path d="M1129 814Q1160 1092 984 1259" fill="none" stroke="#ddd6cb" stroke-width="35"/>
    <path d="M1129 814Q1160 1092 984 1259" fill="none" stroke="#eee9df" stroke-width="28"/>
    <text x="1119" y="654" transform="rotate(90 1119 654)">창가</text>
  </g>
  <g id="columns" fill="#e5e9ef" stroke="#cfd6e1" stroke-width="3">
    <circle cx="1128" cy="741" r="31"/>
    <circle cx="800" cy="1265" r="31"/>
    <circle cx="500" cy="960" r="30"/>
    <circle cx="112" cy="1110" r="30"/>
