<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">미래도서관 1층 ④ We플레이스 목업 좌석배치도</title>
  <desc id="desc">사용자가 교정한 배치와 VR 사진을 참고한 도식. 작은 테이블 네 개, 브라우징 밸리 앞의 큰 흰 테이블 하나, 창가 바와 소파를 나타낸다. PC 예약석을 제외한 42개 이용 지점을 표시한다. 공식 번호, 실제 총 좌석 수, 실측 도면이 아니다.</desc>
  <metadata>2026-10-04. Photo-based free-seat prototype: small tables 16, large shared table 6 provisional points, window bar 6, sculptural sofas 8, visible individual armchair pairs 6. PC reservation seats excluded; original remaining IDs preserved. Not connected to KNU reservations.</metadata>
  <defs>
    <pattern id="tiles" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="#eef0f4" stroke-width="1.5"/></pattern>
    <style>
      text { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #9198a9; font-size: 26px; text-anchor: middle; }
      .zone { fill: #646a7c; font-size: 30px; font-weight: 700; }
      .blue-label { fill: #427f93; }
      .seat-number { fill: #5650dc; font-size: 28px; font-weight: 700; }
    </style>
    <g id="common-table" stroke="#cbd3df" stroke-width="2">
      <rect x="-52" y="-52" width="104" height="104" rx="6" fill="#fff"/>
      <rect x="-28" y="-116" width="56" height="52" rx="10" fill="#e3e8f0"/>
      <rect x="-28" y="64" width="56" height="52" rx="10" fill="#e3e8f0"/>
      <rect x="-116" y="-28" width="52" height="56" rx="10" fill="#e3e8f0"/>
      <rect x="64" y="-28" width="52" height="56" rx="10" fill="#e3e8f0"/>
    </g>
    <g id="armchair-pair" fill="#e3e8f0" stroke="#c5cfdd" stroke-width="2">
      <path d="M-106 -38V37H-26V-38H-40V23H-92V-38Z"/>
      <rect x="-92" y="-25" width="52" height="48" rx="6"/>
      <path d="M106 -38V37H26V-38H40V23H92V-38Z"/>
      <rect x="40" y="-25" width="52" height="48" rx="6"/>
      <circle r="23" fill="#fff"/>
    </g>
    <g id="blue-sofa">
      <ellipse rx="153" ry="146" fill="#eee6d7" stroke="#dfd4c1" stroke-width="2"/>
      <path d="M-24 -48C-81 -67 -99 -134 -32 -139C25 -145 78 -123 57 -80L31 -44C76 -69 126 -47 134 -2C150 62 83 92 52 44L31 17C44 75 26 140 -28 134C-91 132 -105 86 -62 49L-32 23C-91 48 -145 15 -137 -40C-124 -101 -82 -84 -24 -48Z" fill="#62bbcc" stroke="#398a9f" stroke-width="3"/>
      <path d="M-24 -48C-81 -67 -99 -134 -32 -139C25 -145 78 -123 57 -80L31 -44L3 -4Z" fill="#77bbd8"/>
      <path d="M31 -44C76 -69 126 -47 134 -2C150 62 83 92 52 44L31 17L3 -4Z" fill="#439eae"/>
      <path d="M31 17C44 75 26 140 -28 134C-91 132 -105 86 -62 49L-32 23L3 -4Z" fill="#579fc7"/>
      <path d="M-32 23C-91 48 -145 15 -137 -40C-124 -101 -82 -84 -24 -48L3 -4Z" fill="#58b7c7"/>
      <path d="M-27 -82Q-26 -33 3 -4Q37 -16 88 -24M3 -4Q-1 40 -24 91M3 -4Q-52 -4 -94 -32" fill="none" stroke="#33758e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1200" height="1500" fill="#fff"/>
  <path d="M40 80H1160V740Q1190 1340 870 1450H40Z" fill="url(#tiles)"/>
  <g id="browsing-valley-context">
    <path d="M290 20H1160V85H290Z" fill="#f2ede3" stroke="#e1d9cb" stroke-width="2"/>
    <path d="M310 42H1140M310 65H1140" fill="none" stroke="#e3dbcd" stroke-width="2"/>
    <text class="zone" x="725" y="61">③ 브라우징 밸리</text>
  </g>
  <g id="carpet-area">
    <path d="M55 100H890V850L770 915H55Z" fill="#edf1f8" stroke="#dce2ee" stroke-width="2"/>
    <path d="M55 110V895" fill="none" stroke="#c4ccd9" stroke-width="6"/>
  </g>
  <g id="large-table" data-seat-group="large-table">
