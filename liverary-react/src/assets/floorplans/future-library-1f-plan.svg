        <use href="#cafe-round-table" x="163" y="582" width="54" height="54"/>
        <use href="#cafe-round-table" x="163" y="682" width="54" height="54"/>
        <rect x="252" y="590" width="52" height="148" rx="10" class="cafe-furniture"/>
