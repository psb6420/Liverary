      <path d="M1125 697H1425Q1403 797 1320 825H1125Z" fill="#f2f3f8" stroke="#c7cbd7" stroke-width="2"/>
      <rect x="1154" y="720" width="87" height="18" rx="5" class="muted-furniture"/>
      <path d="M1390 724Q1378 773 1334 792" fill="none" stroke="#d9ddea" stroke-width="18" stroke-linecap="round"/>
      <circle cx="1149" cy="776" r="18" fill="#9ba2b5"/>
      <text x="1149" y="776" class="number" style="font-size:20px">4</text>
      <text x="1181" y="785" class="quiet-label">We플레이스</text>
