      <rect x="1223" y="505" width="113" height="21" rx="6" class="muted-furniture"/>
      <rect x="982" y="615" width="89" height="22" rx="6" class="muted-furniture"/>
      <rect x="1240" y="615" width="89" height="22" rx="6" class="muted-furniture"/>
      <rect x="993" y="542" width="313" height="56" rx="9" fill="#f1f0ed"/>
