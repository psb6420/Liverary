<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="plan-title plan-description">
  <title id="plan-title">강원대학교 미래도서관 1층 2D 배치도 · ① 카페 목업 구역</title>
  <desc id="plan-description">강원대학교 도서관의 공식 1층 입체 시설안내도를 참고해 상대적 공간 배치를 단순화한 프로젝트용 도식입니다. ① 카페만 목업 대상으로 강조합니다. 치수와 축척은 없으며, 가구군은 도식화한 것으로 개별 좌석 수나 좌표를 확정하지 않습니다. 북쪽 방향을 나타내는 도면이 아닙니다.</desc>
  <metadata>
    Source: https://library.kangwon.ac.kr/assets/images/kw/contents/milae-floor1.jpg
    Reference page: https://library.kangwon.ac.kr/library-guide/time-and-floors?tabIndex=1&amp;contentIndex=1&amp;floorIndex=1
    Created: 2026-10-03. Layout: schematic, not to scale. Mockup scope: zone-01-cafe only.
  </metadata>
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #222638; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -1.4px; }
      .label { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
      .small { font-size: 17px; fill: #818594; }
      .detail { font-size: 16px; fill: #827d99; }
      .quiet-label { font-size: 20px; font-weight: 600; fill: #7b8091; }
      .purple { fill: #5650dc; }
      .number { font-size: 22px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .outline { fill: none; stroke: #cbd0dd; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .partition { fill: none; stroke: #c7cbd7; stroke-width: 2; }
      .muted-furniture { fill: #dfe2eb; stroke: #c7cbd7; stroke-width: 1.5; }
      .cafe-furniture { fill: #ded9ff; stroke: #aaa0ed; stroke-width: 2; }
      .cafe-chair { fill: #a79cee; }
    </style>
    <clipPath id="floor-clip">
      <path d="M104 258H1362Q1466 258 1466 362V625Q1466 860 1248 860H104Z"/>
    </clipPath>
    <pattern id="terrace-paving" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f1f4f0"/>
      <path d="M20 0H0V20" fill="none" stroke="#e4e9e1" stroke-width="1"/>
    </pattern>
    <symbol id="cafe-table" viewBox="0 0 76 62">
      <rect x="10" y="12" width="56" height="38" rx="10" class="cafe-furniture"/>
      <path d="M25 3H51M25 59H51" fill="none" stroke="#a79cee" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="cafe-round-table" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="15" class="cafe-furniture"/>
      <path d="M8 22V38M52 22V38" fill="none" stroke="#a79cee" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="patio-table" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="26" fill="#fff" stroke="#d5dccc" stroke-width="2"/>
      <path d="m36 10 0 52M10 36h52M18 18l36 36M18 54l36-36" stroke="#e2e7dc" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="3" fill="#b7c5ad"/>
    </symbol>
  </defs>

  <g id="page-background">
    <rect width="1600" height="1000" fill="#f7f8fc"/>
    <rect x="40" y="40" width="1520" height="920" rx="30" fill="#fff" stroke="#e9eaf1" stroke-width="2"/>
  </g>
  <g id="map-heading">
    <rect x="88" y="90" width="58" height="58" rx="17" fill="#5650dc"/>
    <text x="117" y="128" font-size="25" font-weight="700" fill="#fff" style="fill:#fff" text-anchor="middle">1F</text>
    <text x="166" y="124" class="title">미래도서관</text>
    <text x="168" y="157" class="small">1층 배치도</text>
    <rect x="1190" y="94" width="320" height="54" rx="27" fill="#eeedfe"/>
    <circle cx="1220" cy="121" r="5" fill="#5650dc"/>
    <text x="1240" y="129" font-size="21" font-weight="700" class="purple">목업 구역 · ① 카페</text>
    <path d="M88 193H1512" stroke="#e9eaf1" stroke-width="2"/>
  </g>

  <g id="floor-plan" data-floor-id="1F" data-layout="schematic">
